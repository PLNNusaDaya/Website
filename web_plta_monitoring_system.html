const PLTD_CHECKLIST = (() => {
  const fields = [
    {key:'engineId',label:'ID Mesin',type:'text'},
    {key:'machineCode',label:'Kode Mesin',type:'text'},
    {key:'serial',label:'SN / No Seri',type:'text'},
    {key:'installedPower',label:'DT / Daya Terpasang',type:'number'},
    {key:'availablePower',label:'Daya Mampu (kW)',type:'number'},
    {key:'load',label:'Beban (kW)',type:'number'},
    {key:'kwh',label:'Stand kWh (kWh)',type:'number'},
    {key:'fuel',label:'Stand BBM (L)',type:'number'},
    {key:'phaseR',label:'Phasa R',type:'number'},
    {key:'phaseS',label:'Phasa S',type:'number'},
    {key:'phaseT',label:'Phasa T',type:'number'},
    {key:'oil',label:'Tekanan Oli (bar)',type:'number'},
    {key:'temp',label:'Temperatur Air Pendingin (°C)',type:'number'},
    {key:'voltage',label:'Tegangan (V)',type:'number'},
    {key:'frequency',label:'Frekuensi (Hz)',type:'number'},
    {key:'cosPhi',label:'Cos Phi',type:'number',max:1},
    {key:'hours',label:'Jam Kerja Mesin (jam)',type:'number'},
    {key:'machineStatus',label:'Status Mesin',type:'text'},
    {key:'production',label:'kWh Produksi (kWh)',type:'number'},
    {key:'fuelUsage',label:'Pemakaian BBM (L)',type:'number'},
    {key:'fuelType',label:'Jenis Bahan Bakar',type:'text'},
    {key:'note',label:'Keterangan',type:'text'}
  ];
  const blank=v=>v===null||v===undefined||typeof v==='string'&&!v.trim();
  const numeric=fields.filter(f=>f.type==='number');
  function display(r,key,empty='Belum diisi') {
    const v=r?.[key], f=fields.find(f=>f.key===key);
    if(blank(v))return empty;
    if(f?.type==='number'&&Number.isFinite(Number(v)))return Number(v).toLocaleString('id-ID',{maximumFractionDigits:3});
    return String(v);
  }
  function validate(r,{draft=false}={}) {
    for(const f of numeric){
      const v=r[f.key];
      if(blank(v)){if(!draft)return 'Isi '+f.label+'.';continue;}
      if(!['number','string'].includes(typeof v)||!Number.isFinite(Number(v))||Number(v)<0)return f.label+' harus berupa angka nol atau lebih.';
      if(f.max!==undefined&&Number(v)>f.max)return f.label+' harus berada pada rentang 0–'+f.max+'.';
    }
    if(!draft&&!['Operasi','Standby','Gangguan-Rusak'].includes(r.machineStatus))return 'Pilih status mesin.';
    if(!draft&&blank(r.fuelType))return 'Isi jenis bahan bakar yang digunakan.';
    return '';
  }
  function csv(rows) {
    const columns=[{key:'id',label:'ID Logsheet'},{key:'date',label:'Tanggal'},{key:'time',label:'Waktu WIB'},{key:'unit',label:'Sentral'},{key:'unitId',label:'ID Unit'},{key:'machine',label:'Merk / Nama Mesin'},{key:'type',label:'Tipe Mesin'},{key:'operator',label:'Operator'},...fields,{key:'status',label:'Status Laporan'},{key:'review',label:'Catatan Tinjauan'}];
    const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
    return '\uFEFF'+[columns.map(f=>cell(f.label)).join(','),...rows.map(r=>columns.map(f=>cell(r[f.key])).join(','))].join('\r\n');
  }
  const renameSentral=value=>typeof value==='string'?value.replace(/\bPERIKANAN\b/gi,'Bawean'):value;
  return {fields,numeric,blank,display,validate,csv,renameSentral};
})();
if(typeof module!=='undefined')module.exports=PLTD_CHECKLIST;

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.page){setPage(b.dataset.page);return;}if(b.dataset.report){reportDetail(b.dataset.report);return;}if(b.dataset.user){userForm(b.dataset.user);return;}if(b.dataset.machine){machineForm(b.dataset.machine);return;}if(b.dataset.masterunit){unitForm(b.dataset.masterunit);return;}if(b.dataset.unit){setPage('reports');filters.unit=b.dataset.unit;render();return;}const a=b.dataset.action;if(!a)return;switch(a){case'toggle-report-view':reportView=reportView==='full'?'summary':'full';pageNo=1;render();break;case'menu':$('#sidebar').classList.toggle('open');break;case'logout':try{sessionStorage.removeItem('pltd-web-session-v4');}catch{}loggedIn=false;closeDialog();login();break;case'fill-demo':{const chosen=document.querySelector('input[name=role]:checked').value;$('#login-email').value=DEMO_ACCOUNTS[chosen];$('#login-password').value=DEMO_PASSWORD;$('#login-error').textContent='';break;}case'toggle-password':{const input=$('#login-password'),show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'Sembunyikan':'Lihat';b.setAttribute('aria-label',show?'Sembunyikan kata sandi':'Tampilkan kata sandi');break;}case'forgot-password':showDialog('Bantuan akun demo',`<div class="notice">Gunakan akun contoh sesuai peran dan kata sandi <strong>${DEMO_PASSWORD}</strong>. Tombol “Isi akun contoh” mengisi form secara otomatis.</div><p class="small muted" style="margin-top:16px">Pengajuan reset akun produksi belum terhubung.</p><div class="dialog-foot">${btn('Tutup','close')}</div>`);break;case'reset-master':masterFilters={unit:'Semua sentral',q:''};masterPage=1;render();break;case'master-prev':masterPage=Math.max(1,masterPage-1);render();break;case'master-next':masterPage++;render();break;case'close':closeDialog();break;case'guide':guide();break;case'profile':showDialog('Profil pengguna',`<p><strong>${names[role]}</strong></p><p class="muted" style="margin:10px 0">${role} · Semua unit contoh</p><div class="notice">Peran aktif menentukan menu dan tindakan yang tersedia pada prototipe.</div><div class="dialog-foot">${btn('Tutup','close')}</div>`);break;case'notifications':showDialog('Notifikasi',`<div class="notice amber">${db.reports.filter(r=>r.date===filters.date&&r.status==='Menunggu').length} laporan menunggu tinjauan pada tanggal terpilih.</div><p class="small muted" style="margin-top:14px">Periksa prioritas di dashboard. Notifikasi ini berasal dari data contoh.</p><div class="dialog-foot">${btn('Tutup','close')}</div>`);break;case'reset-filter':filters={date:'2026-10-18',unit:'Semua unit',status:'Semua status',q:'',abnormal:false};pageNo=1;render();break;case'export':exportRows();break;case'print':document.body.classList.remove('print-report');if(['dashboard','reports','approval','monitor'].includes(page)){$('#print-all').innerHTML=rows().map(printLogsheet).join('')||'<p>Tidak ada laporan pada filter ini.</p>';document.body.classList.add('print-all-logsheet');}window.print();break;case'print-detail':document.body.classList.add('print-report');window.print();break;case'prev':pageNo=Math.max(1,pageNo-1);render();break;case'next':if(pageNo*8<rows().length){pageNo++;render();}break;case'add-user':userForm();break;case'add-machine':machineForm();break;case'approve':case'reject':try{const r=PLTD.approve(db,role,selected,a==='approve'?'Disetujui':'Perlu revisi',$('#review-note').value);log(a==='approve'?'Menyetujui laporan':'Meminta revisi',r.id);closeDialog();render();toast(a==='approve'?'Laporan disetujui.':'Permintaan revisi dicatat.');}catch(err){$('#review-error').textContent=err.message;}break;}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,d=new FormData(f),val=k=>String(d.get(k)||'').trim();try{switch(f.id){case'login-form':{const chosen=val('role');if(!PLTD.permissions[chosen]||val('email').toLowerCase()!==DEMO_ACCOUNTS[chosen]||val('password')!==DEMO_PASSWORD){$('#login-error').textContent='Email atau kata sandi tidak sesuai dengan peran yang dipilih.';return;}try{if(d.has('remember'))localStorage.setItem('pltd-web-remember-v4',JSON.stringify({email:val('email'),role:chosen}));else localStorage.removeItem('pltd-web-remember-v4');sessionStorage.setItem('pltd-web-session-v4',JSON.stringify({role:chosen,version:4}));}catch{}loggedIn=true;changeRole(chosen);return;}case'user-form':PLTD.upsertUser(db,role,{id:f.dataset.id,name:val('name'),email:val('email'),role:val('role'),unit:val('unit'),active:d.has('active')});log('Menyimpan pengguna',val('email'));break;case'machine-form':{if(role!=='Superadmin')throw Error('Akses Superadmin diperlukan.');const installedPower=Number(val('installedPower')),availablePower=val('availablePower')===''?null:Number(val('availablePower'));if(availablePower!==null&&(!Number.isFinite(availablePower)||availablePower<0))throw Error('Daya Mampu harus berupa angka nol atau lebih.');if(val('engineId')&&db.machines.some(x=>x.id!==f.dataset.id&&x.engineId===val('engineId')))throw Error('ID Mesin sudah terdaftar.');if(val('machineCode')&&db.machines.some(x=>x.id!==f.dataset.id&&x.unit===val('unit')&&x.machineCode===val('machineCode')))throw Error('Kode Mesin sudah digunakan pada sentral ini.');if(!val('name')||val('installedPower')===''||!Number.isFinite(installedPower)||installedPower<0)throw Error('Merk dan Daya Terpasang bernilai nol atau lebih wajib diisi.');if(db.machines.some(x=>x.id!==f.dataset.id&&x.name.toLowerCase()===val('name').toLowerCase()&&x.unit===val('unit')))throw Error('Nama mesin sudah terdaftar pada sentral ini.');const unit=db.units.find(u=>u.name===val('unit'));if(!unit)throw Error('Pilih sentral yang terdaftar.');const old=db.machines.find(x=>x.id===f.dataset.id),m={...(old||{}),id:f.dataset.id,no:old?.no||Math.max(...db.machines.map(x=>x.no))+1,name:val('name'),unit:unit.name,unitId:unit.id,type:val('type'),serial:val('serial'),installedPower,engineId:val('engineId'),machineCode:val('machineCode'),availablePower};if(old)Object.assign(old,m);else db.machines.push(m);log('Menyimpan master mesin',m.name);break;}case'unit-form':{if(role!=='Superadmin')throw Error('Akses Superadmin diperlukan.');const u=db.units.find(x=>x.id===f.dataset.id),newName=val('name').toUpperCase();if(!newName||!val('region'))throw Error('Nama dan wilayah wajib diisi.');if(db.units.some(x=>x.id!==u.id&&x.name===newName))throw Error('Nama unit telah digunakan.');const oldName=u.name;u.name=newName;u.region=val('region');u.active=d.has('active');for(const list of [db.machines,db.users,db.reports])list.forEach(x=>{if(x.unit===oldName)x.unit=newName;});if(filters.unit===oldName)filters.unit=newName;log('Memperbarui master unit',newName);break;}case'settings-form':if(role!=='Superadmin')throw Error('Akses Superadmin diperlukan.');if(Number(val('radius'))<50||Number(val('radius'))>5000||Number(val('retention'))<1||Number(val('retention'))>10)throw Error('Nilai konfigurasi di luar rentang.');db.settings={interval:Number(val('interval')),radius:Number(val('radius')),retention:Number(val('retention')),gps:d.has('gps'),photo:d.has('photo')};log('Memperbarui kebijakan pelaporan','Pengaturan sistem');break;default:return;}closeDialog();render();toast('Perubahan demonstrasi disimpan.');}catch(err){const error=$('#form-error');if(error)error.textContent=err.message;else toast(err.message);}});
window.addEventListener('afterprint',()=>{document.body.classList.remove('print-report');document.body.classList.remove('print-all-logsheet');$('#print-all').innerHTML='';});
$('#dialog').addEventListener('click',e=>{if(e.target===$('#dialog')){const r=$('#dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
document.addEventListener('change',e=>{if(e.target.matches('input[name=role]')&&e.target.closest('#login-form')){role=e.target.value;$('#demo-account').innerHTML='Akun demo: <strong>'+DEMO_ACCOUNTS[role]+'</strong><br>Kata sandi: <strong>'+DEMO_PASSWORD+'</strong>';$('#login-error').textContent='';if(Object.values(DEMO_ACCOUNTS).includes($('#login-email').value))$('#login-email').value=DEMO_ACCOUNTS[role];}if(e.target.id==='machine-unit'){const u=db.units.find(x=>x.name===e.target.value);$('#machine-unit-id').value=u?.id||'';}});
try{const session=JSON.parse(sessionStorage.getItem('pltd-web-session-v4')||'null');if(session?.version===4&&PLTD.permissions[session.role]&&!window.PLTD_LOGIN_ENTRY&&qs.get('view')!=='login'){role=session.role;loggedIn=true;}}catch{}
if(loggedIn)render();else login();
</script></body></html>
